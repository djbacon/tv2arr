{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <form method="post" action="{{ url_for('login') }}">
    {{ token() }}
    <div class="field">
      <label for="password">Administrator password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"{% if error %} aria-invalid="true"{% endif %}>
    </div>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
