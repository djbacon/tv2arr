services:
  tv2arr:
    image: tv2arr:v0.7.0
    build:
      context: .
      args:
        TV2ARR_VERSION: v0.7.0
    ports:
      - "${TV2ARR_LAN_IP:?Set the Docker host LAN IP}:3077:8080"
    environment:
      TV2ARR_LAN_IP: "${TV2ARR_LAN_IP}"
      TV2ARR_LAN_CIDR: "${TV2ARR_LAN_CIDR:?Set the allowed LAN subnet}"
      TV2ARR_ADMIN_PASSWORD: "${TV2ARR_ADMIN_PASSWORD:?Set a local administrator password}"
    volumes:
      - tv2arr-data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  tv2arr-data:
